components:
    schemas:
        AggregateRating:
            description: https://www.schema.org/AggregateRating
            properties:
                bestRating:
                    type: number
                ratingCount:
                    type: number
                ratingValue:
                    type: number
                worstRating:
                    type: number
            type: object
        BlogPosting:
            description: https://www.schema.org/BlogPosting
            properties:
                aggregateRating:
                    $ref: "#/components/schemas/AggregateRating"
                alternativeHeadline:
                    type: string
                articleBody:
                    type: string
                caption:
                    type: string
                categories:
                    items:
                        properties:
                            categoryId:
                                format: int64
                                type: integer
                            categoryName:
                                type: string
                        type: object
                    readOnly: true
                    type: array
                categoryIds:
                    items:
                        format: int64
                        type: integer
                    type: array
                    writeOnly: true
                contentSpaceId:
                    format: int64
                    type: integer
                creator:
                    $ref: "#/components/schemas/Creator"
                dateCreated:
                    format: date-time
                    type: string
                dateModified:
                    format: date-time
                    type: string
                datePublished:
                    format: date-time
                    type: string
                description:
                    type: string
                encodingFormat:
                    type: string
                friendlyUrlPath:
                    type: string
                hasComments:
                    type: boolean
                headline:
                    type: string
                id:
                    format: int64
                    type: integer
                image:
                    properties:
                        contentUrl:
                            format: uri
                            type: string
                        imageId:
                            format: int64
                            type: integer
                        name:
                            type: string
                    readOnly: true
                    type: object
                imageId:
                    format: int64
                    type: integer
                    writeOnly: true
                keywords:
                    items:
                        type: string
                    type: array
            type: object
        ContentDocument:
            description: https://www.schema.org/ContentDocument
            properties:
                contentUrl:
                    format: uri
                    type: string
                encodingFormat:
                    type: string
                fileExtension:
                    type: string
                id:
                    format: int64
                    type: integer
                sizeInBytes:
                    type: number
                title:
                    type: string
            type: object
        ContentField:
            description: https://www.schema.org/ContentField
            properties:
                dataType:
                    type: string
                inputControl:
                    type: string
                label:
                    type: string
                name:
                    type: string
                nestedFields:
                    items:
                        $ref: "#/components/schemas/ContentField"
                    type: array
                repeatable:
                    type: boolean
                value:
                    properties:
                        data:
                            type: string
                        document:
                            allOf:
                                - $ref: "#/components/schemas/ContentDocument"
                            readOnly: true
                        documentId:
                            format: int64
                            type: integer
                            writeOnly: true
                        geo:
                            description: https://www.schema.org/GeoCoordinates
                            properties:
                                id:
                                    format: int64
                                    type: integer
                                latitude:
                                    type: number
                                longitude:
                                    type: number
                            type: object
                        image:
                            allOf:
                                - $ref: "#/components/schemas/StructuredContentImage"
                            readOnly: true
                        link:
                            format: uri
                            type: string
                        structuredContentId:
                            format: int64
                            type: integer
                            writeOnly: true
                        structuredContentLink:
                            properties:
                                id:
                                    format: int64
                                    type: integer
                                title:
                                    type: string
                            type: object
                    type: object
        ContentListElement:
            description: https://www.schema.org/ContentListElement
            oneOf:
                - properties:
                      structuredContent:
                          $ref: "#/components/schemas/StructuredContent"
                - properties:
                      document:
                          $ref: "#/components/schemas/Document"
                - properties:
                      blogPosting:
                          $ref: "#/components/schemas/BlogPosting"
                - properties:
                      folder:
                          $ref: "#/components/schemas/Folder"
                - properties:
                      genericContentListElement:
                          $ref: "#/components/schemas/GenericContentListElement"
            properties:
                contentType:
                    type: string
                order:
                    type: number
        Creator:
            description: https://www.schema.org/Creator
            properties:
                additionalName:
                    type: string
                familyName:
                    type: string
                givenName:
                    type: string
                id:
                    format: int64
                    type: integer
                image:
                    format: uri
                    type: string
                name:
                    type: string
                profileURL:
                    format: uri
                    type: string
            type: object
        Document:
            description: https://www.schema.org/Document
            properties:
                adaptedImages:
                    description: https://www.schema.org/ImageObject
                    items:
                        properties:
                            contentUrl:
                                format: uri
                                type: string
                            height:
                                type: number
                            resolutionName:
                                type: string
                            sizeInBytes:
                                type: number
                            width:
                                type: number
                        type: object
                    type: array
                aggregateRating:
                    $ref: "#/components/schemas/AggregateRating"
                categories:
                    items:
                        properties:
                            categoryId:
                                format: int64
                                type: integer
                            categoryName:
                                type: string
                        type: object
                    readOnly: true
                    type: array
                categoryIds:
                    items:
                        format: int64
                        type: integer
                    type: array
                    writeOnly: true
                contentUrl:
                    format: binary
                    type: string
                creator:
                    $ref: "#/components/schemas/Creator"
                dateCreated:
                    format: date-time
                    type: string
                dateModified:
                    format: date-time
                    type: string
                description:
                    type: string
                encodingFormat:
                    type: string
                fileExtension:
                    type: string
                folderId:
                    format: int64
                    type: integer
                id:
                    format: int64
                    type: integer
                keywords:
                    items:
                        type: string
                    type: array
                sizeInBytes:
                    type: number
                title:
                    type: string
                viewableBy:
                    enum: [Anyone, Members, Owner]
                    type: string
                    writeOnly: true
            type: object
        Folder:
            description: https://www.schema.org/Folder
            properties:
                contentSpaceId:
                    format: int64
                    type: integer
                dateCreated:
                    format: date-time
                    type: string
                dateModified:
                    format: date-time
                    type: string
                description:
                    type: string
                hasDocuments:
                    type: boolean
                hasFolders:
                    type: boolean
                id:
                    format: int64
                    type: integer
                name:
                    type: string
            type: object
        GenericContentListElement:
            description: https://www.schema.org/GenericContentListElement
            properties:
                contentSpaceId:
                    format: int64
                    type: integer
                dateCreated:
                    format: date-time
                    type: string
                dateModified:
                    format: date-time
                    type: string
                description:
                    type: string
                id:
                    format: int64
                    type: integer
                title:
                    type: string
            type: object
        StructuredContent:
            description: https://www.schema.org/StructuredContent
            properties:
                aggregateRating:
                    $ref: "#/components/schemas/AggregateRating"
                availableLanguages:
                    items:
                        type: string
                    type: array
                categories:
                    items:
                        properties:
                            categoryId:
                                format: int64
                                type: integer
                            categoryName:
                                type: string
                        type: object
                    type: array
                categoryIds:
                    items:
                        format: int64
                        type: integer
                    type: array
                    writeOnly: true
                contentFields:
                    items:
                        $ref: "#/components/schemas/ContentField"
                    type: array
                contentSpaceId:
                    format: int64
                    type: integer
                contentStructureId:
                    format: int64
                    type: integer
                creator:
                    $ref: "#/components/schemas/Creator"
                dateCreated:
                    format: date-time
                    type: string
                dateModified:
                    format: date-time
                    type: string
                datePublished:
                    format: date-time
                    type: string
                description:
                    type: string
                hasComments:
                    type: boolean
                id:
                    format: int64
                    type: integer
                keywords:
                    items:
                        type: string
                    type: array
                lastReviewed:
                    format: date-time
                    type: string
                renderedContents:
                    description: https://www.schema.org/templates
                    items:
                        properties:
                            renderedContentURL:
                                format: uri
                                type: string
                            templateName:
                                type: string
                        type: object
                    type: array
                title:
                    type: string
                viewableBy:
                    enum: [Anyone, Members, Owner]
                    type: string
                    writeOnly: true
        StructuredContentImage:
            description: https://www.schema.org/StructuredContentImage
            properties:
                contentUrl:
                    format: uri
                    type: string
                creator:
                    $ref: "#/components/schemas/Creator"
                dateCreated:
                    format: date-time
                    type: string
                dateModified:
                    format: date-time
                    type: string
                description:
                    type: string
                encodingFormat:
                    type: string
                fileExtension:
                    type: string
                id:
                    format: int64
                    type: integer
                sizeInBytes:
                    type: number
                structuredContentId:
                    format: int64
                    type: integer
                title:
                    type: string
            type: object
info:
    description: ""
    title: ""
    version: v1.0
openapi: 3.0.1
paths:
    "/content-lists/{content-list-id}/contents":
        get:
            parameters:
                - in: query
                  name: page
                  schema:
                      type: integer
                - in: query
                  name: pageSize
                  schema:
                      type: integer
                - in: path
                  name: content-list-id
                  required: true
                  schema:
                      format: int64
                      type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/ContentListElement"
                                type: array
                    description: ""
            tags: ["ContentListElement"]