components:
    schemas:
        ActionExecutionResult:
            # @review
            description:
                The result of an action execution.
            properties:
                type:
                    # @review
                    description:
                        The type of result.
                    enum: [DisplayPage, None, Notification, Page, URL]
                    type:
                        string
                value:
                    oneOf:
                        - $ref: "#/components/schemas/DisplayPageActionExecutionResult"
                        - $ref: "#/components/schemas/NoneActionExecutionResult"
                        - $ref: "#/components/schemas/NotificationActionExecutionResult"
                        - $ref: "#/components/schemas/SitePageActionExecutionResult"
                        - $ref: "#/components/schemas/URLActionExecutionResult"
            type: object
        BasePageSettings:
            # @review
            description:
                The base settings of a page, shared by both a content page and a widget page.
            properties:
                customMetaTags:
                    # @review
                    description:
                        A list of custom meta tags this page has.
                    items:
                        $ref: "#/components/schemas/CustomMetaTag"
                    type: array
                hiddenFromNavigation:
                    # @review
                    description:
                        A flag that indicates whether the page is hidden from navigation.
                    type: boolean
                navigationMenuSettings:
                    $ref: "#/components/schemas/NavigationMenuSettings"
                    # @review
                    description:
                        The page's site navigation menu settings.
                openGraphSettings:
                    $ref: "#/components/schemas/OpenGraphSettings"
                    # @review
                    description:
                        The page's Open Graph settings.
                seoSettings:
                    $ref: "#/components/schemas/SEOSettings"
                    # @review
                    description:
                        The page's SEO settings.
            type: object
        BasePageSpecification:
            # @review
            description:
                A base page specification, containing the common properties of both a content page page specification
                and a widget page page specification. It should only be referenced as part of an allOf clause.
            properties:
                externalReferenceCode:
                    description:
                        The page specification's external reference code, unique per site.
                    type: string
                settings:
                    $ref: "#/components/schemas/Settings"
                type:
                    # @review
                    description:
                        The type of the page specification.
                    enum:
                        - ContentPageSpecification
                        - WidgetPageSpecification
                    type: string
            type: object
        BasePageTemplate:
            # @review
            description:
                A base page template, containing the common properties of both a content page template and a widget page
                template. It should only be referenced as part of an allOf clause.
            properties:
                creator:
                    $ref: "../../headless-admin-user/headless-admin-user-impl/rest-openapi.yaml#Creator"
                    # @review
                    description:
                        The page template's creator. It is not returned by default. It can be embedded via nestedFields.
                    readOnly: true
                creatorExternalReferenceCode:
                    # @review
                    description:
                        The page's creator external reference code.
                    type: string
                dateCreated:
                    # @review
                    description:
                        The page template's creation date.
                    format: date-time
                    type: string
                dateModified:
                    # @review
                    description:
                        The last time the page template changed.
                    format: date-time
                    type: string
                datePublished:
                    # @review
                    description:
                        The last time the page template was published.
                    format: date-time
                    type: string
                externalReferenceCode:
                    # @review
                    description:
                        The page template's external reference code.
                    type: string
                key:
                    # @review
                    description:
                        The page template's key.
                    type: string
                keywordItemExternalReferences:
                    description:
                        The external references to the associated keywords.
                    items:
                        "$ref": "#/components/schemas/ItemExternalReference"
                    type: array
                keywords:
                    description:
                        The associated keywords. They are not returned by default. They can be embedded via
                        nestedFields.
                    items:
                        $ref: "../../headless-admin-taxonomy/headless-admin-taxonomy-impl/rest-openapi.yaml#Keyword"
                    readOnly: true
                    type: array
                name:
                    # @review
                    description:
                        The page template's name.
                    type: string
                pageSpecifications:
                    # @review
                    description:
                        The page template's specifications. A page template of type content may contain 0 or 1 page
                        specifications in draft status and 0 or 1 page specifications in published status. A page
                        template of type widget contains only 1 page specification in published status.
                    items:
                        $ref: "#/components/schemas/PageSpecification"
                    type: array
                pageTemplateSet:
                    $ref: "#/components/schemas/PageTemplateSet"
                    # @review
                    description:
                        The page template's set.
                pageTemplateSettings:
                    # @review
                    description:
                        The settings of the page template.
                    discriminator:
                        propertyName: type
                    mapping:
                        ContentPageTemplate: "#/components/schemas/ContentPageTemplateSettings"
                        WidgetPageTemplate: "#/components/schemas/WidgetPageTemplateSettings"
                    oneOf:
                        - $ref: "#/components/schemas/ContentPageTemplateSettings"
                        - $ref: "#/components/schemas/WidgetPageTemplateSettings"
                taxonomyCategories:
                    # @review
                    description:
                        The associated categories. They are not returned by default. They can be embedded via
                        nestedFields.
                    items:
                        $ref: "../../headless-admin-taxonomy/headless-admin-taxonomy-impl/rest-openapi.yaml#TaxonomyCategory"
                    readOnly: true
                    type: array
                taxonomyCategoryItemExternalReferences:
                    # @review
                    description:
                        The external references to the associated categories.
                    items:
                        "$ref": "#/components/schemas/ItemExternalReference"
                    type: array
                type:
                    # @review
                    description:
                        The type of the page template.
                    enum:
                        - ContentPageTemplate
                        - WidgetPageTemplate
                    type: string
                uuid:
                    # @review
                    description:
                        A valid external identifier to reference this page template.
                    type: string
            type: object
        BaseWidgetInstance:
            # @review
            description:
                A base page widget instance, containing the common properties of both a content page widget instance and
                a widget page widget instance. It should only be referenced as part of an allOf clause.
            properties:
                widgetConfig:
                    additionalProperties:
                        type: object
                    # @review
                    description:
                        The configuration keys and values of the widget instance.
                    type: object
                widgetInstanceId:
                    # @review
                    description:
                        The widget instance's ID.
                    type: string
                widgetName:
                    # @review
                    description:
                        The widget instance's name.
                    type: string
                widgetPermissions:
                    # @review
                    description:
                        The widget instance's permissions.
                    items:
                        properties:
                            actionIds:
                                # @review
                                description:
                                    The IDs of the actions the role has permission for.
                                items:
                                    type: string
                                type: array
                            roleName:
                                # @review
                                description:
                                    The role's name.
                                type: string
                        type: object
                    type: array
            type: object
        ClassNameReference:
            # @review
            description:
                A reference specifying the class name.
            properties:
                className:
                    type: string
            required:
                - className
        ClassSubtypeReference:
            # @review
            description:
                A reference specifying the class name and an optional subtype.
            properties:
                className:
                    type: string
                subTypeExternalReference:
                    $ref: "#/components/schemas/ItemExternalReference"
            required:
                - className
            type: object
        ClientExtension:
            # @review
            description:
                A reference to a client extension along with its configuration values.
            properties:
                clientExtensionConfig:
                    additionalProperties:
                        type: string
                    # @review
                    description:
                        The configuration keys and values of the client extension.
                    type: object
                externalReferenceCode:
                    # @review
                    description:
                        The client extension's external reference code.
                    type: string
            type: object
        CollectionConfig:
            properties:
                collectionReference:
                    # @review
                    description:
                        The page collection's reference.
                    discriminator:
                        propertyName: collectionType
                    mapping:
                        Collection: "#/components/schemas/ItemExternalReference"
                        CollectionProvider: "#/components/schemas/ClassNameReference"
                    oneOf:
                        - $ref: "#/components/schemas/ClassNameReference"
                        - $ref: "#/components/schemas/ItemExternalReference"
                collectionType:
                    # @review
                    description:
                        The collection's type (Collection, CollectionProvider).
                    enum: [Collection, CollectionProvider]
                    type: string
        CollectionPageSettings:
            allOf:
                - $ref: "#/components/schemas/BasePageSettings"
                - properties:
                      collectionConfig:
                          $ref: "#/components/schemas/CollectionConfig"
                          writeOnly: true
                  required:
                      - collectionConfig
            # @review
            description:
                The settings of a collection page.
            type: object
        CollectionViewport:
            # @review
            description:
                A collection viewport.
            properties:
                collectionViewportDefinition:
                    # @review
                    description:
                        The definition of the collection viewport.
                    properties:
                        numberOfColumns:
                            # @review
                            description:
                                The number of columns of the collection viewport.
                            type: integer
                    type: object
                id:
                    # @review
                    description:
                        The collection viewport's ID.
                    type: string
            required:
                - id
                - collectionViewportDefinition
            type: object
        ColumnViewport:
            # @review
            description:
                A column in a viewport.
            properties:
                columnViewportDefinition:
                    properties:
                        size:
                            maximum: 12
                            minimum: 1
                            type: integer
                    type: object
                id:
                    type: string
            required:
                - columnViewportDefinition
                - id
            type: object
        ContentPageSettings:
            allOf:
                - $ref: "#/components/schemas/BasePageSettings"
            # @review
            description:
                The settings of a content page.
            type: object
        ContentPageSpecification:
            allOf:
                - $ref: "#/components/schemas/BasePageSpecification"
                - properties:
                      pageExperiences:
                          items:
                              $ref: "#/components/schemas/PageExperience"
                          type: array
            # @review
            description:
                A page specification of a content page. A content page may contain 0 or 1 page specifications in draft
                status and 0 or 1 page specifications in published status.
            type: object
        ContentPageTemplate:
            allOf:
                - $ref: "#/components/schemas/BasePageTemplate"
            # @review
            description:
                A content page template.
            type: object
        ContentPageTemplateSettings:
            # @review
            description:
                The settings of a content page.
            type: object
        ContentPageWidgetInstance:
            allOf:
                - $ref: "#/components/schemas/BaseWidgetInstance"
        ContextReference:
            # @review
            description:
                A reference of type context, used in collection display fragments and display page templates.
            properties:
                contextSource:
                    enum: [CollectionItem, DisplayPageItem]
                    type: string
            required:
                - contextSource
            type: object
        CustomCSSViewport:
            # @review
            description:
                Represents a custom CSS viewport.
            properties:
                customCSS:
                    # @review
                    description:
                        The definition of the custom CSS viewport.
                    type: string
                id:
                    # @review
                    description:
                        The custom CSS viewport's ID.
                    type: string
            required:
                - id
                - customCSS
            type: object
        CustomField:
            # @review
            description:
                The value of each custom field. Fields can contain different information types (e.g., geolocation,
                strings, etc.).
            properties:
                customValue:
                    $ref: "#/components/schemas/CustomValue"
                    description:
                        The field's value.
                dataType:
                    description:
                        The field type (e.g., image, text, etc.).
                    readOnly: true
                    type: string
                name:
                    description:
                        The field's internal name. This is valid for comparisons and unique in the structured content.
                    type: string
        CustomMetaTag:
            # @review
            description:
                Represents a custom meta tag.
            properties:
                key:
                    # @review
                    description:
                        The custom meta tag's key.
                    type: string
                value_i18n:
                    additionalProperties:
                        type: string
                    # @review
                    description:
                        The localized custom meta tag's values.
                    type: object
            type: object
        CustomValue:
            # @review
            description:
                Represents a custom value.
            properties:
                data_i18n:
                    additionalProperties:
                        type: string
                    # @review
                    description:
                        The localized field's content values for simple types.
                    type: object
                geo:
                    $ref: "#/components/schemas/Geo"
                    description:
                        A point determined by latitude and longitude.
            type: object
        DefaultFragmentReference:
            # @review
            description:
                A reference to a default fragment (provided out-of-the-box).
            properties:
                defaultFragmentKey:
                    # @review
                    description:
                        The key of the default fragment.
                    type: string
            type: object
        DisplayPageActionExecutionResult:
            # @review
            description:
                Represents a definition of an action execution of type display page.
            properties:
                mapping:
                    # @review
                    description:
                        The mapping of the display page action result.
                    properties:
                        fieldKey:
                            # @review
                            description:
                                The mapping's field key.
                            type: string
                    type: object
            type: object
        DisplayPageTemplate:
            # @review
            description:
                Represents a Display Page template.
            properties:
                contentTypeReference:
                    $ref: "#/components/schemas/ClassSubtypeReference"
                    description:
                        The content type (and optionally subtype) associated to the display page template.
                creator:
                    $ref: "../../headless-admin-user/headless-admin-user-impl/rest-openapi.yaml#Creator"
                    # @review
                    description:
                        The display page template's creator. It is not returned by default. It can be embedded via
                        nestedFields.
                    readOnly: true
                creatorExternalReferenceCode:
                    # @review
                    description:
                        The display page template's creator external reference code.
                    type: string
                dateCreated:
                    # @review
                    description:
                        The display page template's creation date.
                    format: date-time
                    type: string
                dateModified:
                    # @review
                    description:
                        The last time any field of the display page template was changed.
                    format: date-time
                    type: string
                datePublished:
                    # @review
                    description:
                        The display page template's most recent publication date.
                    format: date-time
                    type: string
                default:
                    # @review
                    description:
                        Whether the display page template is the default one for the given content type/subtype.
                    type: boolean
                displayPageTemplateSettings:
                    $ref: "#/components/schemas/DisplayPageTemplateSettings"
                    # @review
                    description:
                        Settings of the display page template, such as SEO or OpenGraph.
                externalReferenceCode:
                    # @review
                    description:
                        The display page template's external reference code.
                    type: string
                friendlyUrlPath_i18n:
                    additionalProperties:
                        type: string
                    # @review
                    description:
                        The localized relative URLs to the display page template's rendered content.
                    type: object
                key:
                    # @review
                    description:
                        The display page template's key.
                    type: string
                name:
                    # @review
                    description:
                        The display page template's name.
                    type: string
                pageSpecifications:
                    # @review
                    description:
                        The display page template's specifications. A display page template may contain 0 or 1 page
                        specifications in draft status and 0 or 1 page specifications in published status.
                    items:
                        $ref: "#/components/schemas/PageSpecification"
                    type: array
                parentFolder:
                    $ref: "#/components/schemas/DisplayPageTemplateFolder"
                    # @review
                    description:
                        The display page template's parent folder.
                thumbnail:
                    $ref: "#/components/schemas/ItemExternalReference"
                    # @review
                    description:
                        The display page template's thumbnail.
                uuid:
                    # @review
                    description:
                        A valid external identifier to reference this display page template.
                    type: string
            type: object
        DisplayPageTemplateFolder:
            # @review
            description:
                Represents a Display Page template folder.
            properties:
                creator:
                    $ref: "../../headless-admin-user/headless-admin-user-impl/rest-openapi.yaml#Creator"
                    # @review
                    description:
                        The display page template folder's creator. It is not returned by default. It can be embedded
                        via nestedFields.
                    readOnly: true
                creatorExternalReferenceCode:
                    # @review
                    description:
                        The display page template folder's creator external reference code.
                    type: string
                dateCreated:
                    # @review
                    description:
                        The display page template folder's creation date.
                    format: date-time
                    type: string
                dateModified:
                    # @review
                    description:
                        The last time any field of the display page template folder was changed.
                    format: date-time
                    type: string
                description:
                    # @review
                    description:
                        The display page template folder's description.
                    type: string
                externalReferenceCode:
                    # @review
                    description:
                        The display page template folder's external reference code.
                    type: string
                key:
                    # @review
                    description:
                        The display page template folder's key.
                    type: string
                name:
                    # @review
                    description:
                        The display page template folder's name.
                    type: string
                uuid:
                    # @review
                    description:
                        A valid external identifier to reference this page template folder.
                    type: string
            type: object
        DisplayPageTemplateSettings:
            # @review
            description:
                Represents the settings of a Display Page Template.
            properties:
                openGraphSettings:
                    $ref: "#/components/schemas/OpenGraphSettings"
                    # @review
                    description:
                        The display page template's Open Graph settings.
                seoSettings:
                    $ref: "#/components/schemas/SEOSettings"
                    # @review
                    description:
                        The display page template's SEO settings.
            type: object
        FragmentComposition:
            # @review
            description:
                Represents a composition of fragments that can be added to a site page.
            properties:
                collectionExternalReferenceCode:
                    # @review
                    description:
                        The external reference code of the collection this fragment composition belongs to.
                    type: string
                creator:
                    $ref: "../../headless-admin-user/headless-admin-user-impl/rest-openapi.yaml#Creator"
                    # @review
                    description:
                        The fragment composition's creator. It is not returned by default. It can be embedded via
                        nestedFields.
                    readOnly: true
                creatorExternalReferenceCode:
                    # @review
                    description:
                        The page's creator external reference code.
                    type: string
                dateCreated:
                    description:
                        The structured content's creation date.
                    format: date-time
                    type: string
                dateModified:
                    description:
                        The last time any field of the structured content was changed.
                    format: date-time
                    type: string
                datePublished:
                    description:
                        The structured content's most recent publication date.
                    format: date-time
                    type: string
                description:
                    # @review
                    description:
                        The description of this fragment composition.
                    type: string
                externalReferenceCode:
                    # @review
                    description:
                        The external reference code of this fragment composition.
                    type: string
                key:
                    # @review
                    description:
                        The fragment composition's key.
                    type: string
                name:
                    # @review
                    description:
                        The fragment composition's name.
                    type: string
                pageElement:
                    $ref: "#/components/schemas/PageElement"
                    # @review
                    description:
                        The fragment composition's page element, whose definition must be of type PageSectionDefinition.
                thumbnail:
                    $ref: "#/components/schemas/ItemExternalReference"
                    # @review
                    description:
                        The fragment composition's thumbnail.
            type: object
        FragmentField:
            # @review
            description:
                Represents a fragment field.
            properties:
                id:
                    # @review
                    description:
                        The fragment field's ID.
                    type: string
                value:
                    anyOf:
                        - $ref: "#/components/schemas/FragmentFieldAction"
                        - $ref: "#/components/schemas/FragmentFieldBackgroundImage"
                        - $ref: "#/components/schemas/FragmentFieldHTML"
                        - $ref: "#/components/schemas/FragmentFieldImage"
                        - $ref: "#/components/schemas/FragmentFieldText"
                    # @review
                    description:
                        The fragment field's value.
            type: object
        FragmentFieldAction:
            # @review
            description:
                Represents a fragment field with an action.
            properties:
                action:
                    # @review
                    description:
                        The fragment field's action. Must be mapped to an external value.
                    oneOf:
                        - $ref: "#/components/schemas/FragmentMappedValue"
                onError:
                    $ref: "#/components/schemas/ActionExecutionResult"
                    # @review
                    description:
                        The action execution result in case the action fails.
                onSuccess:
                    $ref: "#/components/schemas/ActionExecutionResult"
                    # @review
                    description:
                        The action execution result in case the action succeeds.
                text:
                    # @review
                    description:
                        The fragment field's text.
                    oneOf:
                        - $ref: "#/components/schemas/FragmentInlineValue"
                        - $ref: "#/components/schemas/FragmentMappedValue"
            type: object
        FragmentFieldBackgroundImage:
            # @review
            description:
                Represents a fragment field with a background image.
            properties:
                backgroundFragmentImage:
                    $ref: "#/components/schemas/FragmentImage"
                    # @review
                    description:
                        The fragment field's background image.
            type: object
        FragmentFieldHTML:
            # @review
            description:
                Represents a fragment field with HTML.
            properties:
                html:
                    # @review
                    description:
                        The fragment field's HTML. Can be inline or mapped to an external value.
                    oneOf:
                        - $ref: "#/components/schemas/FragmentInlineValue"
                        - $ref: "#/components/schemas/FragmentMappedValue"
            type: object
        FragmentFieldImage:
            # @review
            description:
                Represents a fragment field with an image.
            properties:
                fragmentImage:
                    $ref: "#/components/schemas/FragmentImage"
                    # @review
                    description:
                        The fragment field's image.
                fragmentLink:
                    $ref: "#/components/schemas/FragmentLink"
                    # @review
                    description:
                        A link to a fragment.
            type: object
        FragmentFieldText:
            # @review
            description:
                Represents a fragment field with text.
            properties:
                fragmentLink:
                    $ref: "#/components/schemas/FragmentLink"
                    # @review
                    description:
                        A link to a fragment.
                text:
                    # @review
                    description:
                        The fragment field's text.
                    oneOf:
                        - $ref: "#/components/schemas/FragmentInlineValue"
                        - $ref: "#/components/schemas/FragmentMappedValue"
            type: object
        FragmentImage:
            # @review
            description:
                Represents a fragment image.
            properties:
                config:
                    # @review
                    description:
                        Represents the Adaptive Media fragment image configuration for different viewports.
                    properties:
                        landscapeMobile:
                            # @review
                            description:
                                The landscape mobile configuration of the fragment image.
                            type: string
                        portraitMobile:
                            # @review
                            description:
                                The portrait mobile configuration of the fragment image.
                            type: string
                        tablet:
                            # @review
                            description:
                                The tablet configuration of the fragment image.
                            type: string
                    type: object
                description:
                    # @review
                    description:
                        The fragment image's description.
                    oneOf:
                        - $ref: "#/components/schemas/FragmentInlineValue"
                itemExternalReference:
                    $ref: "#/components/schemas/ItemExternalReference"
                title:
                    # @review
                    description:
                        The fragment image's title.
                    oneOf:
                        - $ref: "#/components/schemas/FragmentInlineValue"
                url:
                    # @review
                    description:
                        The fragment image's url. Can be inline or mapped to an external value.
                    oneOf:
                        - $ref: "#/components/schemas/FragmentInlineValue"
                        - $ref: "#/components/schemas/FragmentMappedValue"
            type: object
        FragmentInlineValue:
            # @review
            description:
                Represents a fragment inline value.
            properties:
                value_i18n:
                    additionalProperties:
                        type: string
                    # @review
                    description:
                        The localized fragment's inline values.
                    type: object
            type: object
        FragmentLink:
            # @review
            description:
                Represents a fragment link.
            properties:
                value_i18n:
                    additionalProperties:
                        $ref: "#/components/schemas/FragmentLinkValue"
                    # @review
                    description:
                        The localized fragment link's values.
                    type: object
        FragmentLinkValue:
            # @review
            description:
                Represents a fragment link value.
            properties:
                href:
                    # @review
                    description:
                        The fragment link value's hypertext reference. Can be inline or mapped to an external value.
                    oneOf:
                        - $ref: "#/components/schemas/FragmentInlineValue"
                        - $ref: "#/components/schemas/FragmentMappedValue"
                target:
                    # @review
                    description:
                        The fragment link value's target (blank, parent, self, top).
                    enum: [Blank, Parent, Self, Top]
                    type: string
        FragmentMappedValue:
            # @review
            description:
                Represents a fragment mapped value.
            properties:
                mapping:
                    # @review
                    description:
                        The mapping of the fragment mapped value.
                    properties:
                        fieldKey:
                            # @review
                            description:
                                The mapping's field key.
                            type: string
                        itemReference:
                            # @review
                            description:
                                The mapping's item reference.
                            oneOf:
                                - $ref: "#/components/schemas/ItemExternalReference"
                                - $ref: "#/components/schemas/ContextReference"
                    type: object
            type: object
        FragmentSettingsAllowed:
            # @review
            description:
                Represents the settings of allowed fragments in a page dropzone.
            properties:
                allowedFragments:
                    # @review
                    description:
                        A list of allowed fragments.
                    items:
                        $ref: "#/components/schemas/ItemExternalReference"
                    type: array
            type: object
        FragmentSettingsUnallowed:
            # @review
            description:
                Represents the settings of unallowed fragments in a page dropzone.
            properties:
                unallowedFragments:
                    items:
                        $ref: "#/components/schemas/ItemExternalReference"
                    type: array
            type: object
        FragmentSnapshot:
            # @review
            description:
                Represents the snapshot of a fragment at the time it was added or propagated to a page or page template.
            properties:
                configuration:
                    additionalProperties:
                        type: object
                    # @review
                    description:
                        The fragment's configuration at the time the fragment was added or propagated to the page or
                        page template.
                    type: object
                css:
                    # @review
                    description:
                        The fragment's css at the time the fragment was added or propagated to the page or page
                        template.
                    type: string
                html:
                    # @review
                    description:
                        The fragment's html at the time the fragment was added or propagated to the page or page
                        template.
                    type: string
                js:
                    # @review
                    description:
